name: Temporary Lockfile Candidate Builder

on:
  push:
    branches:
      - security/lockfile-patched-candidate-2026-11
    paths:
      - .github/workflows/dependency-lockfile-bootstrap.yml

permissions:
  contents: read

jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      DFBK_TEST_MODE: local
      SOCIAL_ENABLED: "false"
      SCHEDULER_WRITE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve compatible updates without major forced changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-candidate
          npm audit --json > artifacts/dependency-candidate/before.json || true
          npm audit --omit=dev --json > artifacts/dependency-candidate/prod-before.json || true
          npm update vite wrangler --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts > artifacts/dependency-candidate/audit-fix.log 2>&1 || true
          npm audit --json > artifacts/dependency-candidate/after.json || true
          npm audit --omit=dev --json > artifacts/dependency-candidate/prod-after.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg=JSON.parse(fs.readFileSync("package.json"));
            const lock=JSON.parse(fs.readFileSync("package-lock.json"));
            const before=JSON.parse(fs.readFileSync("artifacts/dependency-candidate/before.json"));
            const after=JSON.parse(fs.readFileSync("artifacts/dependency-candidate/after.json"));
            const prod=JSON.parse(fs.readFileSync("artifacts/dependency-candidate/prod-after.json"));
            const root=lock.packages[""];
            if(JSON.stringify(root.dependencies)!==JSON.stringify(pkg.dependencies)||JSON.stringify(root.devDependencies)!==JSON.stringify(pkg.devDependencies)) throw Error("Lockfile root specs do not match package.json");
            if(after.metadata.vulnerabilities.high > before.metadata.vulnerabilities.high) throw Error("High vulnerability count increased");
            if(prod.metadata.vulnerabilities.total !== 0) throw Error("Production dependency audit no longer zero");
            for(const name of ["vite","wrangler"]){ const version=lock.packages["node_modules/"+name].version; console.log(name+" candidate "+version); }
            console.log("audit high before",before.metadata.vulnerabilities.high,"after",after.metadata.vulnerabilities.high,"prod",prod.metadata.vulnerabilities.total);
          '
          test -z "$(git diff --name-only -- package.json)"
          cp package-lock.json artifacts/dependency-candidate/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Select browser
        shell: bash
        run: |
          BROWSER_PATH=$(node -p "require('playwright').chromium.executablePath()")
          test -x "$BROWSER_PATH"
          echo "PROMO_BROWSER=$BROWSER_PATH" >> "$GITHUB_ENV"
      - name: Full regression on candidate
        run: python3 scripts/full_regression.py --output artifacts/full-regression
      - name: Save candidate and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tested-lockfile-candidate
          path: |
            artifacts/dependency-candidate/
            artifacts/full-regression/
          if-no-files-found: warn
          retention-days: 7

  commit-tested-lockfile:
    needs: resolve-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tested-lockfile-candidate
          path: candidate
      - name: Validate candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg=JSON.parse(fs.readFileSync("package.json"));
            const lock=JSON.parse(fs.readFileSync("candidate/dependency-candidate/package-lock.json"));
            if(lock.lockfileVersion!==3) throw Error("Unexpected lockfile version");
            const root=lock.packages[""];
            for(const field of ["dependencies","devDependencies"]){
              if(JSON.stringify(pkg[field])!==JSON.stringify(root[field])) throw Error("Root specs changed: "+field);
            }
            if(!lock.packages["node_modules/vite"]||!lock.packages["node_modules/wrangler"]) throw Error("Missing required packages");
          '
      - name: Commit only tested package-lock.json to this branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "security/lockfile-patched-candidate-2026-11"
          git diff --quiet -- package-lock.json || { echo "Unexpected local changes"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/package-lock.json?ref=$GITHUB_REF_NAME" --jq .sha)
          python3 - <<'PY'
          import base64, json, pathlib
          p=pathlib.Path("candidate/dependency-candidate/package-lock.json")
          data={"message":"security: lock compatible audited dependency updates (CI-tested)","content":base64.b64encode(p.read_bytes()).decode("ascii"),"branch":"security/lockfile-patched-candidate-2026-11"}
          pathlib.Path("candidate/payload.json").write_text(json.dumps(data))
          PY
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/package-lock.json" -f sha="$sha" --input candidate/payload.json --jq '.commit.sha'
