name: Auth Modal V3 Check
on:
  push:
    branches: [frontend/auth-modal-v3-microsoft]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: git diff --check origin/main...HEAD
      - name: Microsoft / Google contract check
        run: |
          grep -q 'microsoftStartUrl:' src/services/auth.ts
          grep -q 'microsoft_success' src/contexts/AuthContext.tsx
          grep -q 'microsoft_error' src/components/Header.tsx
          grep -q 'onClick={startGoogle}' src/components/AuthModal.tsx
          grep -q 'onClick={startMicrosoft}' src/components/AuthModal.tsx
          ! grep -q 'AppleIcon\|Apple · Demnächst\|auth-v2-provider-apple' src/components/AuthModal.tsx src/styles/auth-v2.css
