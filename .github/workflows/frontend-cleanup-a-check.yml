name: Frontend Cleanup A Check

on:
  push:
    branches:
      - fix/frontend-mvp-consistency-a

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Frozen files unchanged
        run: |
          changed="$(git diff --name-only origin/main...HEAD)"
          ! printf '%s\n' "$changed" | grep -E '(^|/)(AppIntegrationsPage\.tsx|SocialPublishModal\.tsx|SocialPublishingContext\.tsx|services/social\.ts|worker/|database/)'
      - name: P0 stale user copy search
        run: |
          ! grep -R -E "(^|[^0-9])2 Projekte|zwei Projekte|zwei eigenen Projekten|DFBK Pro([^j]|$)|Business-Tarif erforderlich|Testkunde" src --exclude='Testimonials.tsx'
      - name: Auth fake action search
        run: |
          ! grep -R -E "Reset-Link anfordern|Die Oberfläche ist bereit|Die erneute Zustellung wird nach dem Backend-Anschluss aktiviert" src
