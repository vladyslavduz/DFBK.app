name: Social Publishing Type Fix Check

on:
  push:
    branches:
      - fix/social-publishing-post-merge-types

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Worker dry run
        run: npx wrangler deploy --dry-run
      - name: TypeScript diagnostic
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Diff check
        run: git diff --check origin/main...HEAD
