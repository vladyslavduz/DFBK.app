name: DFBK Full Regression (local fixtures)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dfbk-full-regression-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-regression:
    name: Node tests + TypeScript + Vite + browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DFBK_TEST_MODE: local
      SOCIAL_ENABLED: "false"
      SCHEDULER_WRITE_ENABLED: "false"
      NO_COLOR: "1"
    steps:
      - name: Check out repository (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Install isolated Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Select Chromium executable for existing smoke scripts
        shell: bash
        run: |
          echo "PROMO_BROWSER=$(node -p \"require('playwright').chromium.executablePath()\")" >> "$GITHUB_ENV"

      - name: Full Regression (mocked/local, no production)
        run: python3 scripts/full_regression.py --output artifacts/full-regression

      - name: Upload reports (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfbk-full-regression-${{ github.run_id }}
          path: artifacts/full-regression/
          if-no-files-found: warn
          retention-days: 7
