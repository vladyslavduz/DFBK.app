name: Project Management Frontend V1 Check

on:
  push:
    branches:
      - frontend/project-management-trial-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Existing tests
        run: node --test tests/*.test.mjs
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: TypeScript diagnostic
        continue-on-error: true
        run: npx tsc --noEmit
