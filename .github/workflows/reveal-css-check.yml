name: Reveal CSS Check
on:
  push:
    branches: [fix/soften-scroll-reveal-20261014]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: git diff --check origin/main...HEAD
