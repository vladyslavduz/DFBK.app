  <path class="brand" d="M172 35h101v34h-59v22h52v32h-52v52h-42V35z"/>
  <path class="brand" d="M291 35h63c18 0 32 4 42 12 10 8 15 19 15 33 0 9-2 17-7 23-5 7-11 12-19 16 12 4 21 10 27 18 6 8 9 18 9 29 0 16-6 29-19 38-12 9-29 14-50 14h-61V35zm42 30v29h19c8 0 14-1 18-4 4-3 6-7 6-12s-2-9-6-11c-4-2-10-3-18-3h-19zm0 58v31h23c8 0 14-1 18-4 5-3 7-8 7-14s-2-10-7-13c-4-3-10-4-18-4h-23z"/>
