<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">DFBK.app neon</title>
  <desc id="desc">Neon-style DFBK.app logo for integrations animation</desc>
  <defs>
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="g1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="g2"/>
      <feMerge>
        <feMergeNode in="g2"/>
        <feMergeNode in="g1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill:#0c1623; }
      .frame { fill:none; stroke:#aee1ff; stroke-width:10; rx:18; filter:url(#blueGlow); }
      .brand { fill:#dff4ff; filter:url(#blueGlow); }
      .app { fill:#76a7ff; filter:url(#blueGlow); }
      .dot { fill:#ffb000; filter:url(#goldGlow); }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="520" height="150" rx="24"/>
  <rect class="frame" x="10" y="15" width="500" height="120" rx="18"/>
