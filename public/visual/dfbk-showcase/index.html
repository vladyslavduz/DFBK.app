<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DFBK.app — Drei Branchen, ein Workflow</title>
  <meta name="description" content="Gemeinsame DFBK.app Animation für Renovierung, Nagelstudio und Konditorei">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dfbk-preview-page">
  <main class="dfbk-demo-shell">
    <header class="dfbk-demo-header">
      <img class="dfbk-logo" src="assets/svg/brand-logo.svg" alt="DFBK.app">
      <div>
        <p class="dfbk-eyebrow">Dein Foto bringt Kunden</p>
        <h1>Aus deiner Arbeit wird Werbung, die Kunden bringt.</h1>
      </div>
    </header>

    <section id="dfbk-visual" class="dfbk-visual" aria-label="DFBK Workflow für drei Branchen">
      <div class="dfbk-scenario-tabs" aria-label="Branchen auswählen"></div>
      <div class="dfbk-stage" aria-live="polite"></div>
      <div class="dfbk-transition-glow" aria-hidden="true"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
