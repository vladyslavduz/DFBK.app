<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 118" role="img" aria-labelledby="title desc">
  <title id="title">DFBK.app</title>
  <desc id="desc">DFBK.app Hauptlogo als dunkles rechteckiges Emblem</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33485c"/>
      <stop offset=".5" stop-color="#050b12"/>
      <stop offset="1" stop-color="#1d2c3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/>
