  </g>
  <text x="32" y="80" fill="#102a43" stroke="#f7f8f5" stroke-width="7" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-size="65" font-weight="900" letter-spacing="-4">DFBK</text>
  <circle cx="267" cy="78" r="10" fill="#ffb000" stroke="#050b12" stroke-width="3"/>
  <text x="281" y="80" fill="#2563eb" stroke="#f7f8f5" stroke-width="5" paint-order="stroke" font-family="Arial Black,Arial,sans-serif" font-size="44" font-weight="900" letter-spacing="-2">app</text>
</svg>
