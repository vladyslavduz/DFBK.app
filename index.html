<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DFBK — Dein Foto bringt Kunden</title>

  <meta
    name="description"
    content="DFBK verwandelt Fotos deiner Arbeit automatisch in professionellen Marketing-Content."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 30px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        radial-gradient(circle at top, #243347 0%, #111827 45%, #070b12 100%);

      color: white;
    }

    .container {
      width: 100%;
      max-width: 850px;
      text-align: center;
    }

    .logo {
      font-size: clamp(58px, 12vw, 110px);
      font-weight: 800;
      letter-spacing: -4px;
      line-height: 1;
      margin-bottom: 24px;
    }

    .domain {
      font-size: 18px;
      opacity: 0.55;
      margin-bottom: 28px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 5vw, 52px);
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 24px;
    }

    .description {
      max-width: 650px;
      margin: 0 auto;
      font-size: 20px;
      line-height: 1.6;
      color: #cbd5e1;
    }

    .status {
      display: inline-block;
      margin-top: 46px;
      padding: 11px 20px;

      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;

      font-size: 14px;
      color: #94a3b8;

      background: rgba(255,255,255,0.04);
    }

    footer {
      margin-top: 70px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">DFBK</div>

    <div class="domain">DFBK.app</div>

    <h1>Dein Foto bringt Kunden.</h1>

    <p class="description">
      Aus Fotos deiner Arbeit wird automatisch professioneller Content
      für Website, Google Business und Social Media.
    </p>

    <div class="status">
      DFBK befindet sich im Aufbau
    </div>

    <footer>
      © 2026 DFBK von Vladyslav Duz
    </footer>

  </main>

</body>
</html>
